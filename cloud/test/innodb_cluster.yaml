AWSTemplateFormatVersion: 2010-09-09
Description: AWS CloudFormation Template for MySQL InnoDB cluster

Metadata:
  MarketplaceDocumentation:
    EntrypointName: "Launch new do-it-edu VPC"
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Availability Zone Configuration
        Parameters:
          - AvailabilityZone
      - Label:
          default: Network Configuration
        Parameters:
          - VPCCIDR
          - MySQLRouterAccessCIDR
          - PublicSubnetCIDR
          - PrivateSubnetCIDR
          - VPCTenancy
      - Label:
          default: Amazon EC2 Configuration
        Parameters:
          - KeyPairName
          - MySQLRouterInstanceType
          - MySQLSingleInstanceType
          - MySQLInstance1Type
          - MySQLSecondary1InstnaceType
          - MySQLSecondary2InstnaceType
          - MySQLRouterInstanceIPAddress
          - MySQLSingleInstanceIPAddress
          - MySQLInstance1IPAddress
          - MySQLInstance2IPAddress
          - MySQLInstance3IPAddress
      - Label:
          default: MySQL Configuration
        Parameters:
          - NumRouters
          - MySQLShellPassword
          - RootPassword
    ParameterLabels:
      AvailabilityZone:
        default: Availability Zones
      VPCCIDR:
        default: VPC CIDR
      MySQLRouterAccessCIDR:
        default: Allowed MySQL Router External Access CIDR
      PublicSubnetCIDR:
        default: Public Subnet CIDR
      PrivateSubnetCIDR:
        default: Private Subnet CIDR
      VPCTenancy:
        default: VPC Tenancy
      KeyPairName:
        default: Key Pair Name
      MySQLSingleInstanceType:
        default: MySQL Single Instance Type
      MySQLInstance1Type:
        default: MySQL Primary Instance Type
      MySQLInstance2Type:
        default: MySQL Secondary1 Instance Type
      MySQLInstance3Type:
        default: MySQL Secondary2 Instance Type
      MySQLRouterInstanceIPAddress:
        default: MySQL Router Instance Private IP
      MySQLSingleInstanceIPAddress:
        default: MySQL Single Instance Private IP
      MySQLInstance1IPAddress:
        default: MySQL Primary Instance Private IP
      MySQLInstance2IPAddress:
        default: MySQL Secondary1 Instance Private IP
      MySQLInstance3IPAddress:
        default: MySQL Secondary2 Instance Private IP
      NumRouters:
        default: Number of MySQL Router Instance
      MySQLShellPassword:
        default: Password for MySQL Shell account
      RootPassword:
        default: Password for MySQL Root

Parameters:
  AvailabilityZone:
    Description: The Availability Zone for subnets
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2a

  VPCCIDR:
    Description: CIDR block for the Amazon VPC
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  
  MySQLRouterAccessCIDR:
    Description: Allowed CIDR block for external SSH access to MySQLRouter
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/x
    Type: String
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
    
  PublicSubnetCIDR:
    Description: CIDR block for the public subnet
    Type: String
    Default: 10.0.0.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$

  PrivateSubnetCIDR:
    Description: CIDR block for the private subnet
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  
  VPCTenancy:
    Description: The allowed tenancy of instances launched into the VPC
    Type: String
    Default: default
    AllowedValues:
      - default
      - dedicated

  KeyPairName:
    Description: Name of an existing EC2 Keypair to enable SSH access to the Instance
    ConstraintDescription: must be the name of an existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName
  
  MySQLSingleInstanceType:
    Description: Amazon EC2 instance type for MySQL Single Instance
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge
  
  MySQLInstance1Type:
    Description: Amazon EC2 instance type for MySQL Primary Instance
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge

  MySQLInstance2Type:
    Description: Amazon EC2 instance type for MySQL Secondary1 Instance
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge

  MySQLInstance3Type:
    Description: Amazon EC2 instance type for MySQL Secondary2 Instance
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge

  MySQLRouterInstanceType:
    Description: Amazon EC2 instance type for MySQL Router Instance
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.nano
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge
      
  NumRouters:
    Description: The number of MySQL Router Instace to create.
    Type: Number
    Default: 1
    AllowedValues:
      - 1
 
  MySQLRouterInstanceIPAddress:
    Description: This must be a valid IP address for public subnet
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.0.10
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$

  MySQLSingleInstanceIPAddress:
    Description: This must be a valid IP address for private subnet
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.1.20
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$

  MySQLInstance1IPAddress:
    Description: This must be a valid IP address for private subent
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.1.10
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$
  
  MySQLInstance2IPAddress:
    Description: This must be a valid IP address for private subnet
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.1.11
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$
  
  MySQLInstance3IPAddress:
    Description: This must be a valid IP address for private subnet
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.1.12
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$
  
  MySQLShellPassword:
    Description: password for MySQL shell to access innodb cluster
    Type: String
    Default: passwd

  RootPassword:
    Description: password for MySQL root
    Type: String
    Default: passwd

Resources:
#################### VPC Stack ####################

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref 'VPCCIDR'
      InstanceTenancy: !Ref 'VPCTenancy'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref 'VPC'
      InternetGatewayId: !Ref 'InternetGateway'

  PublicSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
      Tags:
        - Key: Name
          Value: Public Subnets

  PublicSubnetRoute:
    DependsOn: VPCGatewayAttachment
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref 'PublicSubnetRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref 'InternetGateway'

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref 'PublicSubnet'
      RouteTableId: !Ref 'PublicSubnetRouteTable'

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'VPC'
      CidrBlock: !Ref 'PublicSubnetCIDR'
      AvailabilityZone: !Ref 'AvailabilityZone'
      Tags:
        - Key: Name
          Value: Public subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'VPC'
      CidrBlock: !Ref 'PrivateSubnetCIDR'
      AvailabilityZone: !Ref 'AvailabilityZone'
      Tags:
        - Key: Name
          Value: Private subnet

  PrivateSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
      Tags:
        - Key: Name
          Value: Private subnet
        - Key: Network
          Value: Private

  PrivateSubnetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref 'PrivateSubnetRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref 'NATGateway'

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref 'PrivateSubnet'
      RouteTableId: !Ref 'PrivateSubnetRouteTable'

  NATEIP:
    DependsOn: VPCGatewayAttachment
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: NATEIP
 
  NATGateway:
    DependsOn: VPCGatewayAttachment
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt 'NATEIP.AllocationId'
      SubnetId: !Ref 'PublicSubnet'
      Tags:
        - Key: Name
          Value: NATGateway
  
#################### Database Stack ####################

# IAM Role
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MySQLInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Principal:
              Service:
                - ec2.amazonaws.com
            Effect: Allow
      Path: /
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSSMFullAccess"
      Policies:
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - ec2:AttachVolume
                  - ec2:DeleteSnapshot
                  - ec2:CreateSnapshot
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateVolume
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:ModifyVpcPeeringConnectionOptions
                  - events:PutEvents
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc-peering-connection/*
                Effect: Allow
              - Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeInstances
                Resource: '*'
                Effect: Allow
          PolicyName: MySQLPolicy
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:ModifyNetworkInterfaceAttribute
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:prefix-list/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Effect: Allow
              - Action:
                  - ec2:DescribeAddresses
                  - ec2:DescribeInstances
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                Resource: '*'
                Effect: Allow
          PolicyName: MySQLPolicy2

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref 'InstanceRole'
      Path: /

# MySQL Router
  MySQLRouterENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PublicSubnet
      Description: Fixed public IP ENI for ASG
      GroupSet:
        - !Ref MySQLRouterSecurityGroup 
      PrivateIpAddress: !Ref MySQLRouterInstanceIPAddress

  MySQLRouterPublicEIP:
    Type: AWS::EC2::EIP

  MySQLRouterPublicEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt MySQLRouterPublicEIP.AllocationId
      NetworkInterfaceId: !Ref MySQLRouterENI

  MySQLRouterAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref MySQLRouterLaunchTemplate
        Version: !GetAtt MySQLRouterLaunchTemplate.LatestVersionNumber
      AvailabilityZones:
        - !Ref 'AvailabilityZone'
      MinSize: !Ref NumRouters
      MaxSize: !Ref NumRouters
      DesiredCapacity: !Ref NumRouters
      Tags:
        - Key: Name
          Value: MySQL Router
          PropagateAtLaunch: true
    CreationPolicy:
      ResourceSignal:
        Count: !Ref NumRouters
        Timeout: PT15M
      AutoScalingCreationPolicy:
        MinSuccessfulInstancesPercent: 100
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: true

  MySQLRouterLaunchTemplate:
    DependsOn:
      - MySQLInstance1
      - MySQLInstance2
      - MySQLInstance3
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/cfn/env.profile:
              content: !Join
                - ''
                - - |
                    export MySQL_Router=/usr/local/mysql-router/bin
                    export MySQL_Shell=/usr/local/mysql-shell/bin
                    export PATH=$PATH:$HOME/.local/bin:$HOME/bin:$MySQL_Router:$MySQL_Shell
                    export SHELL_URL=https://dev.mysql.com/get/Downloads/MySQL-Shell/mysql-shell-8.4.4-linux-glibc2.28-x86-64bit.tar.gz
                    export ROUTER_URL=https://dev.mysql.com/get/Downloads/MySQL-Router/mysql-router-8.4.4-linux-glibc2.28-x86_64.tar.xz
            /etc/cfn/download_router_and_shell.sh:
              content: !Sub |
                #!/bin/bash
                source /etc/cfn/env.profile
                cd /usr/local
                curl -LO $SHELL_URL
                tar -xf mysql-shell-8.4.4-linux-glibc2.28-x86-64bit.tar.gz -C /usr/local
                rm -rf /usr/local/mysql-shell-8.4.4-linux-glibc2.28-x86-64bit.tar.gz
                mv mysql-shell-8.4.4-linux-glibc2.28-x86-64bit mysql-shell
                groupadd mysql
                useradd -g mysql -M -s /bin/false mysql
                chown -R mysql mysql-shell
                cd /usr/local
                curl -LO $ROUTER_URL
                tar -xf mysql-router-8.4.4-linux-glibc2.28-x86_64.tar.xz -C /usr/local
                mv mysql-router-8.4.4-linux-glibc2.28-x86_64 mysql-router
                rm -rf /usr/local/mysql-router-8.4.4-linux-glibc2.28-x86_64.tar.xz
                chown -R mysql mysql-router

            /etc/cfn/configure_cluster.sh:
              content: !Sub |
                #!/bin/bash
                source /etc/cfn/env.profile
                mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.10:3306 --js -e 'dba.configureInstance();'<<EOF
                y
                y
                EOF
                mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.11:3306 --js -e 'dba.configureInstance();'<<EOF
                y
                y
                EOF
                mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.12:3306 --js -e 'dba.configureInstance();'<<EOF
                y
                y
                EOF
                sleep 5
                mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.10:3306 --js -e 'cluster = dba.createCluster("cls");'<<EOF
                cluster.addInstance('shell@10.0.1.11:3306', {password: '${MySQLShellPassword}', recoveryMethod: 'clone'})
                cluster.addInstance('shell@10.0.1.12:3306', {password: '${MySQLShellPassword}', recoveryMethod: 'clone'})
                cluster.status()
                EOF

            /etc/cfn/download_sysbench.sh:
              content: !Join 
                - ''
                - - | 
                    #!/bin/bash
                    # install prerequisites
                    sudo dnf install -y pip
                    sudo dnf install -y mariadb105-devel gcc python3-devel
                    pip install mysqlclient
                    sudo dnf -y install make automake libtool pkgconfig libaio-devel git 
                    # install sysbench
                    git clone https://github.com/akopytov/sysbench.git
                    cd sysbench
                    # build 
                    ./autogen.sh
                    ./configure
                    make -j
                    make install

            /etc/cfn/download_mysql.sh:
              content: !Sub |
                #!/bin/bash
                source /etc/cfn/env.profile
                cd /usr/local
                curl -LO $MySQL_URL
                tar -xf mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz -C /usr/local
                rm -rf /usr/local/mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz
                mv mysql-8.4.4-linux-glibc2.28-x86_64 mysql
                groupadd mysql
                useradd -g mysql -M -s /bin/false mysql
                mkdir -p /mysql/data
                mkdir -p /mysql/log
                chown -R mysql mysql
                chown -R mysql /mysql

            /etc/cfn/configure_mysql_single.sh:
              content: !Sub |
                #!/bin/bash
                source /etc/cfn/env.profile
                mysqld --defaults-file=/etc/my.cnf --user=mysql --initialize-insecure
                nohup mysqld_safe --defaults-file=/etc/my.cnf > /var/log/mysqld_safe.log 2>&1 &
                sleep 5
                mysql -u root<<EOF
                CREATE USER 'mysql'@'${MySQLRouterInstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';
                GRANT ALL ON *.* TO 'mysql'@'${MySQLRouterInstanceIPAddress}' WITH GRANT OPTION;
                EOF
                ps -ef | grep mysqld

            /etc/cfn/configure_mysql_instance.sh:
              content: !Sub |
                #!/bin/bash
                source /etc/cfn/env.profile
                mysqld --defaults-file=/etc/my.cnf --user=mysql --initialize-insecure
                nohup mysqld_safe --defaults-file=/etc/my.cnf > /var/log/mysqld_safe.log 2>&1 &
                sleep 5
                mysql -u root<<EOF
                CREATE USER 'shell'@'${MySQLRouterInstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';
                CREATE USER 'shell'@'${MySQLInstance1IPAddress}' IDENTIFIED BY '${MySQLShellPassword}';
                CREATE USER 'shell'@'${MySQLInstance2IPAddress}' IDENTIFIED BY '${MySQLShellPassword}';
                CREATE USER 'shell'@'${MySQLInstance3IPAddress}' IDENTIFIED BY '${MySQLShellPassword}';
                GRANT ALL ON *.* TO 'shell'@'${MySQLRouterInstanceIPAddress}' WITH GRANT OPTION;
                GRANT ALL ON *.* TO 'shell'@'${MySQLInstance1IPAddress}' WITH GRANT OPTION;
                GRANT ALL ON *.* TO 'shell'@'${MySQLInstance2IPAddress}' WITH GRANT OPTION;
                GRANT ALL ON *.* TO 'shell'@'${MySQLInstance3IPAddress}' WITH GRANT OPTION;
                EOF
                ps -ef | grep mysqld
                /opt/aws/bin/cfn-signal --resource ${AWS::StackName} --stack ${AWS::StackName} --region ${AWS::Region}

            /etc/cfn/configure_mysql_router.sh:
              content: !Sub |
                #!/bin/bash
                source /etc/cfn/env.profile
                # Router 설정 디렉토리 생성
                mkdir -p /mysql
                mkdir -p /mysql/router
                chown -R mysql:mysql /mysql
                mysqlrouter --bootstrap shell@${MySQLInstance1IPAddress}:3306 -d /mysql/router --user=mysql<<EOF
                ${MySQLShellPassword}
                EOF
                cd /mysql/router
                ./start.sh
                
    Properties:
      LaunchTemplateName: MySQLRouterLaunchTemplate
      LaunchTemplateData:
        IamInstanceProfile: 
          Arn: !GetAtt
            - InstanceProfile
            - Arn
        InstanceType: !Ref MySQLRouterInstanceType
        ImageId : !FindInMap
          - ImageMap
          - Ubuntu24.04
          - ImageId
        KeyName: !Ref KeyPairName
        NetworkInterfaces:
          - NetworkInterfaceId: !Ref MySQLRouterENI
            DeviceIndex: 0
        UserData:
          Fn::Base64:
            Fn::Join:
              - ''
              - - "#!/bin/bash -xe\n"
                - '/opt/aws/bin/cfn-init -v '
                - '         --stack '
                - Ref: 'AWS::StackName'
                - '         --resource MySQLRouterLaunchTemplate '
                - '         --region '
                - Ref: 'AWS::Region'
                - "\n"
                - "chmod +x /etc/cfn/download_router_and_shell.sh\n"
                - "chmod +x /etc/cfn/configure_cluster.sh\n"
                - "chmod +x /etc/cfn/download_sysbench.sh\n"
                - "chmod +x /etc/cfn/configure_mysql_router.sh\n"
                - "/etc/cfn/download_router_and_shell.sh\n"
                - "/etc/cfn/configure_cluster.sh\n"
                - "/etc/cfn/download_sysbench.sh\n"
                - "/etc/cfn/configure_mysql_router.sh\n"
                - '/opt/aws/bin/cfn-signal -e $? '
                - '         --stack '
                - Ref: 'AWS::StackName'
                - '         --resource MySQLRouterAutoScalingGroup '
                - '         --region '
                - Ref: 'AWS::Region'
                - "\n"
  
  MySQLRouterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP access
      VpcId: !Ref 'VPC'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MySQLRouterAccessCIDR
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MySQLRouterAccessCIDR
        - IpProtocol: tcp
          FromPort: 6446
          ToPort: 6446
          CidrIp: !Ref MySQLRouterAccessCIDR
        - IpProtocol: tcp
          FromPort: 6447
          ToPort: 6447
          CidrIp: !Ref MySQLRouterAccessCIDR
        - IpProtocol: tcp
          FromPort: 6450
          ToPort: 6450
          CidrIp: !Ref MySQLRouterAccessCIDR
        - IpProtocol: tcp
          FromPort: 6448
          ToPort: 6448
          CidrIp: !Ref MySQLRouterAccessCIDR
        - IpProtocol: tcp
          FromPort: 6449
          ToPort: 6449
          CidrIp: !Ref MySQLRouterAccessCIDR

# MySQLSingleInstance
