AWSTemplateFormatVersion: 2010-09-09
Description: AWS CloudFormation Template for MySQL InnoDB cluster

Metadata:
  MarketplaceDocumentation:
    EntrypointName: "Launch new do-it-edu VPC"
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Availability Zone Configuration
        Parameters:
          - AvailabilityZone
      - Label:
          default: Network Configuration
        Parameters:
          - VPCCIDR
          - MySQLRouterAccessCIDR
          - PublicSubnetCIDR
          - PrivateSubnetCIDR
          - VPCTenancy
      - Label:
          default: Amazon EC2 Configuration
        Parameters:
          - KeyPairName
          - MySQLRouterInstanceType
          - MySQLPrimaryInstanceType
          - MySQLSecondary1InstnaceType
          - MySQLSecondary2InstnaceType
          - MySQLPrimaryInstanceIPAddress
          - MySQLSecondary1InstanceIPAddress
          - MySQLSecondary2InstanceIPAddress
      - Label:
          default: MySQL Configuration
        Parameters:
          - NumRouters
          - MySQLShellPassword
          - RootPassword
    ParameterLabels:
      AvailabilityZone:
        default: Availability Zones
      VPCCIDR:
        default: VPC CIDR
      MySQLRouterAccessCIDR:
        default: Allowed MySQL Router External Access CIDR
      PublicSubnetCIDR:
        default: Public Subnet CIDR
      PrivateSubnetCIDR:
        default: Private Subnet CIDR
      VPCTenancy:
        default: VPC Tenancy
      KeyPairName:
        default: Key Pair Name
      MySQLPrimaryInstanceType:
        default: MySQL Primary Instance Type
      MySQLSecondary1InstanceType:
        default: MySQL Secondary1 Instance Type
      MySQLSecondary2InstanceType:
        default: MySQL Secondary2 Instance Type
      MySQLPrimaryInstanceIPAddress:
        default: MySQL Primary Instance Private IP
      MySQLSecondary1InstanceIPAddress:
        default: MySQL Secondary1 Instance Private IP
      MySQLSecondary2InstanceIPAddress:
        default: MySQL Secondary2 Instance Private IP
      NumRouters:
        default: Number of MySQL Router Instance
      MySQLShellPassword:
        default: Password for MySQL Shell account
      RootPassword:
        default: Password for MySQL Root
Parameters:
  AvailabilityZone:
    Description: The Availability Zone for subnets
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2a

  VPCCIDR:
    Description: CIDR block for the Amazon VPC
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  
  MySQLRouterAccessCIDR:
    Description: Allowed CIDR block for external SSH access to MySQLRouter
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/x
    Type: String
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
    
  PublicSubnetCIDR:
    Description: CIDR block for the public subnet
    Type: String
    Default: 10.0.0.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$

  PrivateSubnetCIDR:
    Description: CIDR block for the private subnet
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  
  VPCTenancy:
    Description: The allowed tenancy of instances launched into the VPC
    Type: String
    Default: default
    AllowedValues:
      - default
      - dedicated

  KeyPairName:
    Description: Name of an existing EC2 Keypair to enable SSH access to the Instance
    ConstraintDescription: must be the name of an existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName

  MySQLPrimaryInstanceType:
    Description: Amazon EC2 instance type for MySQL Primary Instance
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.large
      - t3.large
      - t3.xlarge
      - t3.2xlarge

  MySQLSecondary1InstanceType:
    Description: Amazon EC2 instance type for MySQL Secondary1 Instance
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.large
      - t3.large
      - t3.xlarge
      - t3.2xlarge

  MySQLSecondary2InstanceType:
    Description: Amazon EC2 instance type for MySQL Secondary2 Instance
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.large
      - t3.large
      - t3.xlarge
      - t3.2xlarge

  MySQLRouterInstanceType:
    Description: Amazon EC2 instance type for MySQL Router Instance
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.large
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge
      
  NumRouters:
    Description: The number of MySQL Router Instace to create.
    Type: Number
    Default: 1
    AllowedValues:
      - 1
    
  MySQLPrimaryInstanceIPAddress:
    Description: This must be a valid IP address for private subent
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.1.10
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$
  
  MySQLSecondary1InstanceIPAddress:
    Description: This must be a valid IP address for private subnet
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.1.11
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$
  
  MySQLSecondary2InstanceIPAddress:
    Description: This must be a valid IP address for private subnet
    ConstraintDescription: IP address parameter must be in the form x.x.x.x
    Type: String
    Default: 10.0.1.12
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$
  
  MySQLShellPassword:
    Description: password for MySQL shell to access innodb cluster
    Type: String
    Default: passwd

  RootPassword:
    Description: password for MySQL root
    Type: String
    Default: passwd

Resources:
#################### VPC Stack ####################

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref 'VPCCIDR'
      InstanceTenancy: !Ref 'VPCTenancy'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref 'AWS::StackName'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref 'VPC'
      InternetGatewayId: !Ref 'InternetGateway'

  PublicSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
      Tags:
        - Key: Name
          Value: Public Subnets

  PublicSubnetRoute:
    DependsOn: VPCGatewayAttachment
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref 'PublicSubnetRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref 'InternetGateway'

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref 'PublicSubnet'
      RouteTableId: !Ref 'PublicSubnetRouteTable'

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'VPC'
      CidrBlock: !Ref 'PublicSubnetCIDR'
      AvailabilityZone: !Ref 'AvailabilityZone'
      Tags:
        - Key: Name
          Value: Public subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'VPC'
      CidrBlock: !Ref 'PrivateSubnetCIDR'
      AvailabilityZone: !Ref 'AvailabilityZone'
      Tags:
        - Key: Name
          Value: Private subnet

  PrivateSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'VPC'
      Tags:
        - Key: Name
          Value: Private subnet
        - Key: Network
          Value: Private

  PrivateSubnetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref 'PrivateSubnetRouteTable'
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref 'NATGateway'

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref 'PrivateSubnet'
      RouteTableId: !Ref 'PrivateSubnetRouteTable'

  NATEIP:
    DependsOn: VPCGatewayAttachment
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: NATEIP
 
  NATGateway:
    DependsOn: VPCGatewayAttachment
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt 'NATEIP.AllocationId'
      SubnetId: !Ref 'PublicSubnet'
      Tags:
        - Key: Name
          Value: NATGateway
  
#################### Database Stack ####################

# IAM Role
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MySQLInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Principal:
              Service:
                - ec2.amazonaws.com
            Effect: Allow
      Path: /
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSSMFullAccess"
      Policies:
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - ec2:AttachVolume
                  - ec2:DeleteSnapshot
                  - ec2:CreateSnapshot
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateVolume
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:ModifyVpcPeeringConnectionOptions
                  - events:PutEvents
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc-peering-connection/*
                Effect: Allow
              - Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeInstances
                Resource: '*'
                Effect: Allow
          PolicyName: MySQLPolicy
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Action:
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:ModifyNetworkInterfaceAttribute
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:prefix-list/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Effect: Allow
              - Action:
                  - ec2:DescribeAddresses
                  - ec2:DescribeInstances
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                Resource: '*'
                Effect: Allow
          PolicyName: MySQLPolicy2

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref 'InstanceRole'
      Path: /

# MySQL Router
  MySQLRouterAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref MySQLRouterLaunchTemplate
        Version: !GetAtt MySQLRouterLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref PublicSubnet
      MinSize: !Ref NumRouters
      MaxSize: !Ref NumRouters
      DesiredCapacity: !Ref NumRouters
      Tags:
        - Key: Name
          Value: MySQL Router
          PropagateAtLaunch: true
    CreationPolicy:
      ResourceSignal:
        Count: !Ref NumRouters
        Timeout: PT15M
      AutoScalingCreationPolicy:
        MinSuccessfulInstancesPercent: 100
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: true

  MySQLRouterLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn:
      - MySQLPrimaryInstance
      - MySQLSecondary1Instance
      - MySQLSecondary2Instance
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/cfn/env.profile:
              content: !Join
                - ''
                - - |
                    export MySQL_Router=/usr/local/mysql-router/bin
                    export MySQL_Shell=/usr/local/mysql-shell/bin
                    export PATH=$PATH:$HOME/.local/bin:$HOME/bin:$MySQL_Router:$MySQL_SHELL
                    export SHELL_URL=https://dev.mysql.com/get/Downloads/MySQL-Shell/mysql-shell-8.4.4-linux-glibc2.28-x86-64bit.tar.gz
                    export ROUTER_URL=https://dev.mysql.com/get/Downloads/MySQL-Router/mysql-router-8.4.4-linux-glibc2.28-x86_64.tar.xz
    Properties:
      LaunchTemplateName: MySQLRouterLaunchTemplate
      LaunchTemplateData:
        IamInstanceProfile: 
          Arn: !GetAtt
            - InstanceProfile
            - Arn
        InstanceType: !Ref MySQLRouterInstanceType
        ImageId : !FindInMap
          - ImageMap
          - Ubuntu24.04
          - ImageId
        KeyName: !Ref KeyPairName
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
            - !Ref MySQLRouterSecurityGroup
            SubnetId: !Ref PublicSubnet
        UserData:
          Fn::Base64:
            Fn::Join:
              - ''
              - - "#!/bin/bash -xe\n"
                -  '/opt/aws/bin/cfn-init -v '
                - '         --stack '
                - Ref: 'AWS::StackName'
                - '         --resource MySQLRouterLaunchTemplate '
                - '         --region '
                - Ref: 'AWS::Region'
                - "\n"
                - "source /etc/cfn/env.profile\n"
                - "cd /usr/local\n"
                - "curl -LO $SHELL_URL\n"
                - "tar -xf mysql-shell-8.4.4-linux-glibc2.28-x86-64bit.tar.gz -C /usr/local\n"
                - "rm -rf /usr/local/mysql-shell-8.4.4-linux-glibc2.28-x86-64bit.tar.gz\n"
                - "mv mysql-shell-8.4.4-linux-glibc2.28-x86-64bit mysql-shell\n"
                - "groupadd mysql\n"
                - "useradd -g mysql -M -s /bin/false mysql\n"
                - "chown -R mysql mysql-shell\n"
                - "cd /usr/local\n"
                - "curl -LO $ROUTER_URL\n"
                - "tar -xf mysql-router-8.4.4-linux-glibc2.28-x86_64.tar.xz -C /usr/local\n"
                - "mv mysql-router-8.4.4-linux-glibc2.28-x86_64 mysql-router\n"
                - "rm -rf /usr/local/mysql-router-8.4.4-linux-glibc2.28-x86_64.tar.xz\n"
                - "chown -R mysql mysql-router\n"
                - !Sub "mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.10:3306 --js -e 'dba.configureInstance();'<<EOF\n"
                - "y\n"
                - "y\n"
                - "EOF\n"
                - !Sub "mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.11:3306 --js -e 'dba.configureInstance();'<<EOF\n"
                - "y\n"
                - "y\n"
                - "EOF\n"
                - !Sub "mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.12:3306 --js -e 'dba.configureInstance();'<<EOF\n"
                - "y\n"
                - "y\n"
                - "EOF\n"
                - "mysqlsh --uri shell:${MySQLShellPassword}@10.0.1.10:3306 --js -e<<EOF\n"
                - "cluster = dba.createCluster('cls');\n"
                - "cluster.addInstance('shell@10.0.1.11:3306', {"
                - "password: '${MySQLShellPassword}', recoveryMethod: 'clone'})\n"
                - "cluster.addInstance('shell@10.0.1.12:3306', {"
                - "password: '${MySQLShellPassword}', recoveryMethod: 'clone'})\n"
                - "cluster.status()\n"
                - "EOF\n"
                - '/opt/aws/bin/cfn-signal -e $? '
                - '         --stack '
                - Ref: 'AWS::StackName'
                - '         --resource MySQLRouterAutoScalingGroup '
                - '         --region '
                - Ref: 'AWS::Region'
                - "\n"

  MySQLInstanceLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: optional
  
  MySQLRouterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP access
      VpcId: !Ref 'VPC'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MySQLRouterAccessCIDR
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MySQLRouterAccessCIDR

# MySQLPrimaryInstance
  MySQLPrimaryInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/cfn/env.profile:
              content: !Join
                - ''
                - - |    
                    export MySQL_URL=https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz
                    export MySQL=/usr/local/mysql/bin
                    export PATH=$PATH:$HOME/.local/bin:$HOME/bin:$MySQL
            /etc/my.cnf:
              content: !Join
                - ''
                - - |
                    [client]
                    port    = 3306
                    socket  = /tmp/mysql.sock
                    [mysqld]
                    user      = mysql
                    port      = 3306
                    basedir   = /usr/local/mysql
                    datadir   = /mysql/data
                    log-error = /mysql/log/mysql_error.log
    Properties:
      InstanceType: !Ref MySQLPrimaryInstanceType
      IamInstanceProfile: !Ref InstanceProfile
      ImageId : !FindInMap
        - ImageMap
        - Ubuntu24.04
        - ImageId
      KeyName: !Ref KeyPairName
      UserData:
        Fn::Base64:
          Fn::Join:
            - ""
            - - "#!/bin/bash -xe\n"
              - '/opt/aws/bin/cfn-init -v '
              - '         --stack '
              - Ref: 'AWS::StackName'
              - '         --resource MySQLPrimaryInstance '
              - '         --region '
              - Ref: 'AWS::Region'
              - "\n"
              - "source /etc/cfn/env.profile\n"
              - "cd /usr/local\n"
              - "curl -LO $MySQL_URL\n"
              - "tar -xf mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz -C /usr/local\n"
              - "rm -rf /usr/local/mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz\n"
              - "mv mysql-8.4.4-linux-glibc2.28-x86_64 mysql\n"
              - "groupadd mysql\n"
              - "useradd -g mysql -M -s /bin/false mysql\n"
              - "mkdir -p /mysql/data\n"
              - "mkdir -p /mysql/log\n"
              - "chown -R mysql mysql\n"
              - "chown -R mysql /mysql\n"
              - "mysqld --defaults-file=/etc/my.cnf --user=mysql --initialize-insecure\n"
              - "nohup mysqld_safe --defaults-file=/etc/my.cnf > /var/log/mysqld_safe.log 2>&1 &\n"
              - "SHELL_IP=$(aws ec2 describe-instances "
              - "--filters 'Name=tag:Name,Values=MySQL Router' "
              - "--query 'Reservations[*].Instance[*].PrivateIpAddress' "
              - "--output text)\n"
              - "mysql -u root<<EOF\n"
              - !Sub "CREATE USER 'shell'@'$SHELL_IP' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - !Sub "CREATE USER 'shell'@'${MySQLPrimaryInstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - !Sub "CREATE USER 'shell'@'${MySQLSecondary1InstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - !Sub "CREATE USER 'shell'@'${MySQLSecondary2InstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - "GRANT ALL ON *.* TO 'shell'@'$SHELL_IP' WITH GRANT OPTION;\n"
              - "GRANT ALL ON *.* TO 'shell'@'${MySQLPrimaryInstanceIPAddress}' WITH GRANT OPTION;\n"
              - "GRANT ALL ON *.* TO 'shell'@'${MySQLSecondary1InstanceIPAddress}' WITH GRANT OPTION;\n"
              - "GRANT ALL ON *.* TO 'shell'@'${MySQLSecondary2InstanceIPAddress}' WITH GRANT OPTION;\n"
              - !Sub "ALTER USER ‘root’@’localhost’ IDENTIFIED BY '${RootPassword}';\n"
              - "EOF\n"
              - "ps -ef | grep mysqld\n"
              - "/opt/aws/bin/cfn-signal "
              - "--resource MySQLPrimaryInstance --stack ${AWS::StackName} --region ${AWS::Region}\n"

      NetworkInterfaces:
        - GroupSet:
            - !Ref MySQLPrimaryInstanceSecurityGroup
          SubnetId: !Ref PrivateSubnet
          DeviceIndex: "0"
          AssociatePublicIpAddress: false
          PrivateIpAddresses:
            - PrivateIpAddress: !Ref MySQLPrimaryInstanceIPAddress
              Primary: true
      Tags:
        - Key: Name
          Value: MySQLPrimaryInstance

  MySQLPrimaryInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: MySQL Primary Instance Security Group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !GetAtt MySQLRouterSecurityGroup.GroupId
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt MySQLRouterSecurityGroup.GroupId

# MySQL Secondary1 Instance  
  MySQLSecondary1Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/cfn/env.profile:
              content: !Join
                - ''
                - - |    
                    export MySQL_URL=https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz
                    export MySQL=/usr/local/mysql/bin
                    export PATH=$PATH:$HOME/.local/bin:$HOME/bin:$MySQL                    
            /etc/my.cnf:
              content: !Join
                - ''
                - - |
                    [client]
                    port    = 3306
                    socket  = /tmp/mysql.sock
                    [mysqld]
                    user      = mysql
                    port      = 3306
                    basedir   = /usr/local/mysql
                    datadir   = /mysql/data
                    log-error = /mysql/log/mysql_error.log 
    Properties:
      InstanceType: !Ref MySQLSecondary1InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      ImageId : !FindInMap
        - ImageMap
        - Ubuntu24.04
        - ImageId
      KeyName: !Ref KeyPairName
      UserData:
        Fn::Base64:
          Fn::Join:
            - ""
            - - "#!/bin/bash -xe\n"
              -  '/opt/aws/bin/cfn-init -v '
              - '         --stack '
              - Ref: 'AWS::StackName'
              - '         --resource MySQLSecondary1Instance '
              - '         --region '
              - Ref: 'AWS::Region'
              - "\n"
              - "source /etc/cfn/env.profile\n"
              - "cd /usr/local\n"
              - "curl -LO $MySQL_URL\n"
              - "tar -xf mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz -C /usr/local\n"
              - "rm -rf /usr/local/mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz\n"
              - "mv mysql-8.4.4-linux-glibc2.28-x86_64 mysql\n"
              - "groupadd mysql\n"
              - "useradd -g mysql -M -s /bin/false mysql\n"
              - "mkdir -p /mysql/data\n"
              - "mkdir -p /mysql/log\n"
              - "chown -R mysql mysql\n"
              - "chown -R mysql /mysql\n"
              - "mysqld --defaults-file=/etc/my.cnf --user=mysql --initialize-insecure\n"
              - "nohup mysqld_safe --defaults-file=/etc/my.cnf > /var/log/mysqld_safe.log 2>&1 &\n"
              - "SHELL_IP=$(aws ec2 describe-instances "
              - "--filters 'Name=tag:Name,Values=MySQL Router' "
              - "--query 'Reservations[*].Instance[*].PrivateIpAddress' "
              - "--output text)\n"
              - "mysql -u root<<EOF\n"
              - !Sub "CREATE USER 'shell'@'$SHELL_IP' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - !Sub "CREATE USER 'shell'@'${MySQLPrimaryInstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - !Sub "CREATE USER 'shell'@'${MySQLSecondary1InstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - !Sub "CREATE USER 'shell'@'${MySQLSecondary2InstanceIPAddress}' IDENTIFIED BY '${MySQLShellPassword}';\n"
              - "GRANT ALL ON *.* TO 'shell'@'$SHELL_IP' WITH GRANT OPTION;\n"
              - "GRANT ALL ON *.* TO 'shell'@'${MySQLPrimaryInstanceIPAddress}' WITH GRANT OPTION;\n"
              - "GRANT ALL ON *.* TO 'shell'@'${MySQLSecondary1InstanceIPAddress}' WITH GRANT OPTION;\n"
              - "GRANT ALL ON *.* TO 'shell'@'${MySQLSecondary2InstanceIPAddress}' WITH GRANT OPTION;\n"
              - !Sub "ALTER USER ‘root’@’localhost’ IDENTIFIED BY '${RootPassword}';\n"
              - "EOF\n"
              - "ps -ef | grep mysqld\n"
              - "/opt/aws/bin/cfn-signal "
              - "--resource MySQLSecondary1Instance --stack ${AWS::StackName} --region ${AWS::Region}\n"
