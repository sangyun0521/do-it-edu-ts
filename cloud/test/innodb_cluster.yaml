          SubnetId: !Ref PrivateSubnet
          DeviceIndex: "0"
          AssociatePublicIpAddress: false
          PrivateIpAddresses:
            - PrivateIpAddress: !Ref MySQLSecondary1InstanceIPAddress
              Primary: true
      Tags:
        - Key: Name
          Value: MySQLSecondary1Instance

  MySQLSecondary1InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPC
      GroupDescription: MySQL Secondary1 Instance Security Group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !GetAtt MySQLRouterSecurityGroup.GroupId
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt MySQLRouterSecurityGroup.GroupId

# MySQL Secondary2 Instance  
  MySQLSecondary2Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/cfn/env.profile:
              content: !Join
                - ''
                - - |    
                    export MySQL_URL=https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.4-linux-glibc2.28-x86_64.tar.xz
                    export MySQL=/usr/local/mysql/bin
                    export PATH=$PATH:$HOME/.local/bin:$HOME/bin:$MySQL
                    
            /etc/my.cnf:
              content: !Join
                - ''
                - - |
                    [client]
                    port    = 3306
                    socket  = /tmp/mysql.sock
